[project]
name = "tenantguard"
version = "0.1.0"
description = "Tenant-isolation enforcement layer for multi-tenant LLM apps, with a canary-based leak benchmark (B0-B3)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "redis>=5",
    "redisvl>=0.4",
    "pyjwt>=2.9",
    "mcp>=2.2",
    "httpx>=0.27",
    "pyyaml>=6",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Real embeddings (bge-small-en-v1.5 via ONNX). Without it the deterministic hashing embedder is used.
embed = ["fastembed>=0.4"]
# Presidio PII redaction in egress. Without it a regex fallback is used.
pii = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
# The default LLM is local Ollama (qwen3:4b) and needs no extra package.
# Paid API, disabled by default: needs this extra AND TG_ALLOW_PAID_LLM=1 AND LLM_PROVIDER=anthropic.
paid-llm = ["anthropic>=1.0"]
# B2 baseline. Needs Hugging Face access to Llama Prompt Guard 2.
firewall = ["llamafirewall"]
tracing = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp>=1.25"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "tenantguard*", "mcp_server*", "attacks*", "eval*", "baselines*"]

[tool.setuptools.package-data]
attacks = ["cases.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
