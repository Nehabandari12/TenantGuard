# Tenant-isolation checks, grouped by route and tagged with OWASP items
# (LLM Top 10 2025: LLM01/02/08; Agentic Top 10: ASI01/02/03/06).
#
# as:     tenant/user whose session is scored
# setup:  steps run first as other users (e.g. to put data in a cache, memory or log)
# steps:  endpoint ask|agent|logs|mcp
#           ask/agent: text, optional headers
#           logs:      optional params
#           mcp:       tool, args, auth: none|login   (calls the MCP server directly)
# The injection route reuses the planted tickets from app/seed.py (T-1013..15, T-2013..15).
# Each route's -14 check asks for the reply in an encoded form (base64, spaced characters,
# reversed), so its leak only counts if the detector decodes it.

