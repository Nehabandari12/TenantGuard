name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (pinned)
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Unit tests
        run: pytest -q

  # Builds the database from sql/ the way docker compose does, seeds it, turns RLS on (the B3
  # state) and checks that the policies really separate tenants.
  rls-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tenantguard
        ports:
          - "55432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d tenantguard"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8
        ports:
          - "56379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      EMBEDDER: hash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (pinned)
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Create roles, schema and policies
        run: psql -v ON_ERROR_STOP=1 -h localhost -p 55432 -U postgres -d tenantguard -f sql/001_init.sql
        env:
          PGPASSWORD: postgres
      - name: Seed
        run: python -m app.seed
      - name: Turn RLS enforcement on
        run: python -m tenantguard.admin rls on
      - name: RLS audit
        run: python -m tenantguard.rls_audit
      - name: Audit catches broken policies
        run: pytest -q tests/test_rls.py
        env:
          TG_DB_TESTS: "1"
